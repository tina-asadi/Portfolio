/* ---------- Availability and matching ---------- */
function availTables(date,start,party){return TABLES.filter(t=>t.cap>=party&&free(t.id,date,start,start+DUR));}
function level(date,start,party){
  if(party>6)return 'full';
  if(!availTables(date,start,party).length)return 'full';
  const used=TABLES.filter(t=>!free(t.id,date,start,start+DUR)).reduce((a,t)=>a+t.cap,0)/TOTAL_SEATS;
  return used<.4?'quiet':(used<.75?'moderate':'busy');
}
const LV={quiet:'Quiet',moderate:'Moderate',busy:'Busy',full:'Full'};
function match(){
  return availTables(S.date,S.time,S.guests).map(t=>{
    let sc=-2*(t.cap-S.guests);const hits=[];
    S.prefs.forEach(p=>{if(t.tags.includes(p)){sc+=10;hits.push(p);}});
    let why='';
    if(S.occasion==='Birthday'&&(t.tags.includes('booth')||t.cap>=4)){sc+=t.tags.includes('booth')?4:2;why='birthday';}
    if(S.occasion==='Date night'&&S.guests<=2&&t.tags.includes('quiet')){sc+=6;why='date night';}
    if(S.occasion==='Date night'&&S.guests<=2&&t.tags.includes('window'))sc+=3;
    if(S.occasion==='Business'&&t.tags.includes('quiet')){sc+=6;why='business dining';}
    if(S.occasion==='Family'&&t.tags.includes('booth')){sc+=4;why='family dining';}
    return{t,sc,hits,why};
  }).sort((a,b)=>b.sc-a.sc||a.t.id.localeCompare(b.t.id));
}
function reason(m){
  const bits=['Seats '+m.t.cap];
  const tagTxt=m.t.tags.map(x=>TAGLBL[x]).join(', ');if(tagTxt)bits.push(tagTxt);
  let s=bits.join(', ');
  const ex=[];if(m.hits.length)ex.push('your '+m.hits.map(h=>TAGLBL[h]).join(' and ')+' preference');
  if(m.why)ex.push('a '+m.why+' evening');
  if(ex.length)s+='. Matches '+ex.join(' and ')+'.';
  return s;
}

function sync(){
  if(S.time==null){S.matches=[];return;}
  S.matches=match();

}

/* ---------- Floor plan with chairs ---------- */
function floorSVG(info){
  let g='<rect class="zone" x="16" y="16" width="262" height="196" rx="14"/><text class="zl" x="30" y="36">WINDOW</text>'+
   '<rect class="zone" x="296" y="16" width="328" height="196" rx="14"/><text class="zl" x="310" y="36">MAIN HALL</text>'+
   '<rect class="zone" x="16" y="232" width="608" height="196" rx="14"/><text class="zl" x="30" y="252">PATIO</text>';
  TABLES.forEach(t=>{
    const i=info(t),r=t.cap===2?24:(t.cap===4?30:38),sq=t.zone==='Patio',cd=(sq?r*1.22:r)+11;
    let ch='';
    for(let k=0;k<t.cap;k++){const a=k/t.cap*6.2832+(t.cap===2?0:.4);ch+='<rect class="chair" x="-6.5" y="-4.5" width="13" height="9" rx="3.5" transform="translate('+(t.x+Math.cos(a)*cd).toFixed(1)+' '+(t.y+Math.sin(a)*cd).toFixed(1)+') rotate('+(a*57.296+90).toFixed(1)+')"/>';}
    const shape=sq?'<rect class="shape" x="'+(t.x-r)+'" y="'+(t.y-r)+'" width="'+(2*r)+'" height="'+(2*r)+'" rx="7"/>':'<circle class="shape" cx="'+t.x+'" cy="'+t.y+'" r="'+r+'"/>';
    g+='<g class="tb '+i.cls+(i.picked?' picked':'')+(i.pref?' pref':'')+'" data-act="'+(i.act||'')+'" data-table="'+t.id+'" '+(i.act?'tabindex="0" role="button"':'role="img"')+' aria-label="'+esc(i.aria)+'">'+
      '<circle class="halo" cx="'+t.x+'" cy="'+t.y+'" r="'+(cd+10)+'"/>'+ch+shape+
      '<text class="t1" x="'+t.x+'" y="'+(t.y-2)+'">'+t.id+'</text><text class="t2" x="'+t.x+'" y="'+(t.y+11)+'">'+esc(i.sub)+'</text></g>';
  });
  return '<svg class="floor" viewBox="0 0 640 444" role="group" aria-label="Restaurant floor plan">'+g+'</svg>';
}

/* realistic table top: wood, linen, ceramic, glass, candle; one setting per guest */
function tableTop(cap,filled,square,newFrom,vb){
  const R=cap<=2?34:(cap<=4?42:50),cx=100,cy=100;let s='';
  const tw=square?'<rect x="'+(cx-R-6)+'" y="'+(cy-R*.8)+'" width="'+(2*R+12)+'" height="'+(R*1.6)+'" rx="7" fill="url(#woodg)" filter="url(#woodf)" stroke="#1b120c" stroke-width="1.5"/>':'<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="url(#woodg)" filter="url(#woodf)" stroke="#1b120c" stroke-width="1.5"/>';
  s+=(square?'<rect x="'+(cx-R-2)+'" y="'+(cy-R*.8+6)+'" width="'+(2*R+12)+'" height="'+(R*1.6)+'" rx="9" fill="#000" opacity=".55" filter="url(#soft)"/>':'<circle cx="'+(cx+4)+'" cy="'+(cy+8)+'" r="'+R+'" fill="#000" opacity=".55" filter="url(#soft)"/>');
  const pos=[];for(let k=0;k<cap;k++){const a=-Math.PI/2+k/cap*Math.PI*2+(cap===2?Math.PI/2:0);pos.push(a);}
  pos.forEach((a,k)=>{const deg=a*180/Math.PI-90,rc=R+(square?15:17);
    let x=cx+Math.cos(a)*rc,y=cy+Math.sin(a)*rc;
    if(square){x=cx+Math.cos(a)*(R*.95+14);y=cy+Math.sin(a)*(R*.62+14);}
    s+='<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+deg.toFixed(1)+')"><rect x="-12" y="-7" width="24" height="15" rx="6" fill="url(#leather)" stroke="#4a382d" stroke-width=".8"/><rect x="-9" y="-6" width="18" height="4" rx="2" fill="#fff" opacity=".07"/></g>';});
  s+=tw;
  pos.forEach((a,k)=>{if(k>=filled)return;const deg=a*180/Math.PI-90,rr=square?R*.5:R*.62,x=cx+Math.cos(a)*rr*(square?1.25:1),y=cy+Math.sin(a)*rr*(square?.8:1);
    s+='<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+deg.toFixed(1)+')"><g class="av'+(k>=newFrom?' new':'')+'">'+
     '<rect x="-27" y="-10" width="8" height="18" rx="1.5" fill="#d9d2c3" transform="rotate(-4 -23 0)"/><rect x="-26" y="-9" width="6" height="16" rx="1" fill="#fff" opacity=".35"/>'+
     '<circle cx="1.5" cy="2.5" r="12" fill="#000" opacity=".35" filter="url(#soft)"/><circle cx="0" cy="0" r="12" fill="url(#plg)" stroke="#b9b1a2" stroke-width=".7"/><circle cx="0" cy="0" r="7.6" fill="none" stroke="#000" stroke-opacity=".12"/><circle cx="-3" cy="-4" r="3" fill="#fff" opacity=".6"/>'+
     '<rect x="-17.4" y="-10" width="1.8" height="17" rx=".9" fill="url(#metal)"/><path d="M17 -10Q19.6 -4 17.8 7L16 7Q15.4 -3 17 -10Z" fill="url(#metal)"/>'+
     '<circle cx="15" cy="-15" r="5.6" fill="#000" opacity=".25" filter="url(#soft)"/><circle cx="14" cy="-16" r="5" fill="#cfe0ee" fill-opacity=".16" stroke="#fff" stroke-opacity=".55" stroke-width=".7"/><circle cx="12.6" cy="-17.4" r="1.4" fill="#fff" opacity=".7"/>'+
     '</g></g>';});
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="20" fill="url(#flame)"/><circle cx="'+(cx+1)+'" cy="'+(cy+2)+'" r="4.4" fill="#000" opacity=".4" filter="url(#soft)"/><circle cx="'+cx+'" cy="'+cy+'" r="3.6" fill="#efe5d2"/><circle cx="'+cx+'" cy="'+(cy-1.6)+'" r="1.4" fill="#ffe6a8"/>';
  return '<svg viewBox="'+(vb||'0 0 200 200')+'" role="img" aria-label="Table set for '+filled+'">'+s+'</svg>';
}
function settingSVG(t,guests){return tableTop(t.cap,Math.min(guests,t.cap),t.zone==='Patio',99,'0 18 200 164').replace('<svg ','<svg class="setting" ');}

function applyTint(){const el=$('#app');if(!el||!el.style)return;
  if(S.view==='home'||S.view==='menu'){const d=DISHES[S.dish],c=S.theme==='light'?d.al:d.ac;
    el.style.setProperty('--accent',c);el.style.setProperty('--tint',c);
    el.style.setProperty('--accent-soft','color-mix(in srgb,'+c+' 18%,var(--surface))');
    el.style.setProperty('--on-accent',S.theme==='light'?'#fff':'#14100c');}
  else['--accent','--tint','--accent-soft','--on-accent'].forEach(k=>el.style.removeProperty(k));}

function codeSVG(seed){
  let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))|0;const r=rng(h),N=21;let c='';
  const finder=(x,y)=>'<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="currentColor"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#e9dcc3"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="currentColor"/>';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);if(!inF&&r()<.5)c+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="currentColor"/>';}
  return '<svg class="code" viewBox="0 0 21 21" role="img" aria-label="Sample arrival code pattern">'+c+finder(0,0)+finder(14,0)+finder(0,14)+'</svg>';
}

  const byD=days.map(d=>({d:d.iso,n:all.filter(r=>r.date===d.iso).length})),mxd=Math.max(1,...byD.map(x=>x.n));
  const occ=(date,s)=>TABLES.filter(t=>!free(t.id,date,s,s+DUR)).reduce((a,t)=>a+t.cap,0)/TOTAL_SEATS;
  const peakOcc=Math.round(days.reduce((a,d)=>a+occ(d.iso,19*60),0)/days.length*100);

function releaseAndOffer(date){offer(date);}
function offer(date){
  const waiting=WAIT.filter(e=>e.date===date&&e.status==='WAITING').sort((a,b)=>a.seq-b.seq);
  for(const e of waiting){
    const c=availTables(date,e.time,e.party).sort((a,b)=>a.cap-b.cap)[0];
    if(c){const hr=addRes({date,table:c.id,start:e.time,party:e.party,name:e.name,email:e.email,phone:e.phone,status:'HOLD',source:'waitlist',holdUntil:Date.now()+15*60000});
      e.status='OFFERED';e.hold=hr.id;toast('Table '+c.id+' held for '+e.name+' for 15 minutes.');return true;}
  }
  return false;
}
function cancelRes(id,status){
  const r=RES.find(x=>x.id===id);if(!r)return;
  r.status=status||'CANCELLED';
  toast(status==='NO_SHOW'?'Marked as a no-show. The table is released.':'Booking cancelled. The table is released.');
  if(!offer(r.date)&&WAIT.some(e=>e.date===r.date&&e.status==='WAITING'))toast('Table released. No waiting party fits this slot.');
}
function expireHold(eid,status){
  const e=WAIT.find(x=>x.id===eid);if(!e)return;
  const hr=RES.find(r=>r.id===e.hold);if(hr)hr.status='CANCELLED';
  e.status=status||'EXPIRED';
  offer(e.date);
}
function validateDetails(){
  const d=S.details,e={};

  if(!d.last.trim())e.last='Enter a last name.';else if(d.last.length>50)e.last='Use 50 characters or fewer.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim()))e.email='Enter a valid email address, for example name@example.com.';
  const digits=d.phone.replace(/[\s\-().+]/g,'');
  if(!/^\d{7,15}$/.test(digits))e.phone='Enter a phone number with 7 to 15 digits.';
  return e;
}

  const L={'Window':'W','Main hall':'M','Patio':'P'}[zone];let n=1;while(all.some(t=>t.id===L+n))n++;
