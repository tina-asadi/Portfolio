<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case study | Tina Asadi</title>
<meta name="description" content="A step-by-step case study: plan, idea, low fidelity, high fidelity, prototype and result.">
<link rel="stylesheet" href="style.css">
<script>if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');</script>
<style>
@view-transition { navigation: auto; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
.progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--brand), var(--accent)); }
.nav-actions { display: flex; gap: .75rem; align-items: center; }
.sub { color: var(--subtle); }

/* Intro */
.intro { padding: 4rem 0 2rem; }
.intro h1 { font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.1; margin: .5rem 0 1rem; max-width: 18ch; }
.intro .lead { font-size: 1.15rem; max-width: 60ch; color: var(--subtle); }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin: 2rem 0; padding: 1.25rem 0; border-block: 1px solid var(--border); }
.meta dt { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--subtle); }
.meta dd { margin: .2rem 0 0; font-weight: 600; }
.cover { position: relative; aspect-ratio: 16 / 8; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); }
.cover img, .cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* Layout: chapter rail + story */
.story { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 3rem; padding-bottom: 4rem; }
.rail { position: sticky; top: 90px; align-self: start; display: grid; gap: .25rem; border-left: 2px solid var(--border); }
.rail a { padding: .45rem .9rem; margin-left: -2px; border-left: 2px solid transparent; color: var(--subtle); font-size: .92rem; }
.rail a:hover { color: var(--text); text-decoration: none; }
.rail a[aria-current="true"] { color: var(--text); font-weight: 600; border-left-color: var(--accent); }
@media (max-width: 860px) {
  .story { grid-template-columns: 1fr; gap: 1rem; }
  .rail { position: sticky; top: 58px; z-index: 40; display: flex; overflow-x: auto; border: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); padding: .5rem 0; gap: .5rem; }
  .rail a { white-space: nowrap; border: 1px solid var(--border); border-radius: 999px; margin: 0; }
  .rail a[aria-current="true"] { border-color: var(--accent); }
}

/* Chapters */
.ch { padding: 3rem 0; border-top: 1px solid var(--border); scroll-margin-top: 100px; }
.ch:first-child { border-top: 0; padding-top: 0; }
.kicker { font-size: 3.2rem; font-weight: 800; line-height: 1; color: transparent; -webkit-text-stroke: 1px var(--brand); }
.ch h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin: .4rem 0 1rem; }
.ch p { max-width: 66ch; color: var(--subtle); font-size: 1.05rem; line-height: 1.7; }
.ch > * + * { margin-top: 1.25rem; }
.rv { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
.rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
.step { position: relative; padding-top: 1.1rem; border-top: 2px solid var(--border); }
.step::before { content: ""; position: absolute; top: -6px; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.step b { display: block; }
.step span { color: var(--subtle); font-size: .92rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
.card2 { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem; transition: transform .25s ease, border-color .25s ease; }
.card2:hover { transform: translateY(-4px); border-color: var(--brand); }
.card2 h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
.card2 p { margin: 0; font-size: .95rem; }
.gal { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
.gal img { border: 1px solid var(--border); border-radius: 14px; }

/* Wireframe to high-fidelity slider */
.cmp { --pos: 50%; position: relative; aspect-ratio: 16 / 9; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); touch-action: pan-y; }
.cmp .top { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos)) 0 0); background: var(--card); }
.cmp .line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; background: var(--accent); pointer-events: none; }
.cmp .tagl, .cmp .tagr { position: absolute; top: 12px; padding: .25rem .65rem; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--bg); border: 1px solid var(--border); z-index: 2; }
.cmp .tagl { left: 12px; } .cmp .tagr { right: 12px; }
.cmp input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; cursor: ew-resize; z-index: 3; }
.cmp input::-webkit-slider-runnable-track { background: transparent; height: 100%; }
.cmp input::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; margin-top: calc(50% - 20px); border-radius: 50%; background: var(--accent); border: 4px solid var(--bg); box-shadow: var(--shadow); }
.cmp input::-moz-range-thumb { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); border: 4px solid var(--bg); }
.cmp input:focus-visible { outline: 3px solid var(--brand); outline-offset: -3px; }
.mock { position: absolute; inset: 0; display: grid; gap: 12px; padding: 5%; align-content: start; }
.mock i { display: block; border-radius: 8px; }
.mock .m-nav { height: 28px; } .mock .m-hero { height: 34%; } .mock .m-line { height: 14px; width: 60%; } .mock .m-line.s { width: 40%; }
.mock .m-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; } .mock .m-row i { height: 70px; }
.mock.wire { background: var(--bg); } .mock.wire i { border: 2px dashed var(--border); }
.mock.hifi i { background: color-mix(in srgb, var(--subtle) 25%, transparent); }
.mock.hifi .m-hero { background: linear-gradient(135deg, var(--brand), var(--accent)); }
.mock.hifi .m-row i { background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); }
.hint { font-size: .85rem; color: var(--subtle); }

/* Prototype */
.proto { display: grid; place-items: center; min-height: 420px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); overflow: hidden; box-shadow: var(--shadow); }
.proto-ph { display: grid; gap: 1rem; justify-items: center; text-align: center; padding: 2rem; }
.proto iframe { width: 100%; height: min(78vh, 720px); border: 0; }
.cta { display: flex; gap: .75rem; flex-wrap: wrap; }

/* Result */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; }
.metric { padding: 1.1rem; border: 1px solid var(--border); border-radius: 16px; background: var(--card); }
.metric strong { display: block; font-size: 2.4rem; line-height: 1.1; color: var(--accent); }
.metric span { color: var(--subtle); font-size: .92rem; }
.learned { margin: 0; padding-left: 1.2rem; max-width: 66ch; color: var(--subtle); line-height: 1.7; }

/* Next / previous */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 2rem 0 4rem; border-top: 1px solid var(--border); }
.pager a { display: block; padding: 1.1rem; border: 1px solid var(--border); border-radius: 16px; background: var(--card); color: var(--text); }
.pager a:hover { border-color: var(--brand); text-decoration: none; }
.pager small { display: block; color: var(--subtle); }
.pager .next { text-align: right; }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header>
  <div class="container nav">
    <a class="brand" href="index.html"><span class="dot"></span> Tina Asadi</a>
    <div class="nav-actions">
      <a class="btn" href="index.html#projects">← All projects</a>
      <button id="themeToggle" class="btn" type="button" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</header>

<main class="container" id="app"><noscript><p>This case study needs JavaScript to load.</p></noscript></main>

<script>
/* =====================================================================
"sample-project" block
   ===================================================================== */
const PROJECTS = {
  'sample-project': {
    title: 'Project name',
    summary: 'One sentence: what you made, for whom, and why it matters.',
    meta: { Role: 'UI/UX designer and developer', Timeline: '6 weeks', Tools: 'Figma, HTML, CSS, JavaScript', Type: 'Course project' },
    hero: '', // e.g. 'images/project-cover.png'
    chapters: [
      { id: 'plan', title: 'The plan',
        body: ['[What problem did you set out to solve? Who is it for? What did the brief ask?]'],
        steps: [{ label: 'Week 1', text: 'Research and goals' }, { label: 'Week 2', text: 'Sketches and wireframes' }, { label: 'Week 3 to 4', text: 'High-fidelity design' }, { label: 'Week 5', text: 'Prototype and testing' }, { label: 'Week 6', text: 'Build and polish' }] },
      { id: 'idea', title: 'The idea',
        body: ['[How did the idea form? What did you explore and reject?]'],
        cards: [{ title: 'Decision 1', text: '[What you chose, and why.]' }, { title: 'Decision 2', text: '[What you chose, and why.]' }, { title: 'Decision 3', text: '[What you chose, and why.]' }] },
      { id: 'low-fidelity', title: 'Low fidelity',
        body: ['[Show your sketches and wireframes. What did you learn from them?]'],
        images: [] /* [{src:'images/sketch-1.jpg', alt:'Paper sketch of the home screen'}] */ },
      { id: 'high-fidelity', title: 'Low to high fidelity',
        body: ['[Drag the slider to see how the wireframe became the final design. What changed, and why?]'],
        compare: { before: '', after: '', beforeLabel: 'Wireframe', afterLabel: 'Final design' } },
      { id: 'prototype', title: 'The prototype',
        body: ['[Describe the flow you tested and what you learned from it.]'],
        prototype: { figma: '', link: '' } },
      { id: 'result', title: 'The result',
        body: ['[What shipped? What was the outcome?]'],
        metrics: [{ value: 3, suffix: '', label: 'Key screens designed' }, { value: 100, suffix: '%', label: 'Responsive' }],
        learned: ['[What you would do differently]', '[What you are proud of]'],
        links: [{ label: 'View live site', href: '' }, { label: 'View code', href: '' }] }
    ]
  }
};

/* ============================ Renderer ============================ */
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null && v !== '') el.setAttribute(k, v === true ? '' : v);
  });
  el.append(...kids.flat().filter((x) => x != null && x !== false));
  return el;
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const slugs = Object.keys(PROJECTS);
const slug = new URLSearchParams(location.search).get('p');
const key = PROJECTS[slug] ? slug : slugs[0];
const P = PROJECTS[key];

const mock = (kind) => h('div', { class: 'mock ' + kind }, h('i', { class: 'm-nav' }), h('i', { class: 'm-hero' }), h('i', { class: 'm-line' }), h('i', { class: 'm-line s' }), h('div', { class: 'm-row' }, h('i'), h('i'), h('i')));
const picture = (src, alt, kind) => (src ? h('img', { src, alt: alt || '', loading: 'lazy' }) : mock(kind));

function compare(c) {
  const top = h('div', { class: 'top' }, picture(c.after, c.afterLabel, 'hifi'));
  const wrap = h('div', { class: 'cmp' }, picture(c.before, c.beforeLabel, 'wire'), top,
    h('span', { class: 'tagl' }, c.beforeLabel || 'Before'), h('span', { class: 'tagr' }, c.afterLabel || 'After'), h('div', { class: 'line' }));
  const input = h('input', { type: 'range', min: 0, max: 100, value: 50, 'aria-label': `Reveal ${c.afterLabel || 'final design'} over ${c.beforeLabel || 'wireframe'}` });
  const set = (v) => wrap.style.setProperty('--pos', `calc(${v}% + ${((0.5 - v / 100) * 40).toFixed(1)}px)`);
  input.addEventListener('input', () => set(+input.value));
  set(50);
  wrap.append(input);
  const hint = h('p', { class: 'hint' }, 'Drag the handle, or use the arrow keys.');
  if (!reduce) {  // gentle intro sweep so people notice it is interactive
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      let t = 0;
      const tick = () => { t += 0.03; input.value = 50 + Math.sin(t) * 22 * Math.max(0, 1 - t / 6); set(+input.value); if (t < 6) requestAnimationFrame(tick); else { input.value = 50; set(50); } };
      tick();
    }, { threshold: 0.7 });
    io.observe(wrap);
  }
  return [wrap, hint];
}

function prototype(p) {
  const box = h('div', { class: 'proto' });
  box.append(h('div', { class: 'proto-ph' },
    h('p', {}, p.figma ? 'Try the real, clickable prototype right here.' : 'Add your Figma embed link to show the clickable prototype.'),
    h('div', { class: 'cta' },
      p.figma ? h('button', { type: 'button', class: 'btn-primary', onclick: () => box.replaceChildren(h('iframe', { src: p.figma, title: 'Interactive prototype', allowfullscreen: true })) }, 'Launch prototype') : null,
      p.link ? h('a', { class: 'btn-ghost', href: p.link, target: '_blank', rel: 'noopener' }, 'Open in Figma') : null)));
  return box;
}

function metrics(list) {
  const wrap = h('div', { class: 'metrics' });
  list.forEach((m) => {
    const num = h('strong', {}, '0' + (m.suffix || ''));
    wrap.append(h('div', { class: 'metric' }, num, h('span', {}, m.label)));
    const done = () => { num.textContent = m.value.toLocaleString() + (m.suffix || ''); };
    if (reduce) return done();
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      const start = performance.now();
      const step = (now) => { const t = Math.min((now - start) / 1200, 1); num.textContent = Math.round(m.value * (1 - Math.pow(1 - t, 3))).toLocaleString() + (m.suffix || ''); if (t < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }, { threshold: 0.6 });
    io.observe(num);
  });
  return wrap;
}

function chapter(c, i) {
  const el = h('article', { class: 'ch rv', id: c.id },
    h('div', { class: 'kicker', 'aria-hidden': 'true' }, String(i + 1).padStart(2, '0')),
    h('h2', {}, c.title),
    (c.body || []).map((t) => h('p', {}, t)));
  if (c.steps) el.append(h('div', { class: 'steps' }, c.steps.map((s) => h('div', { class: 'step' }, h('b', {}, s.label), h('span', {}, s.text)))));
  if (c.cards) el.append(h('div', { class: 'cards' }, c.cards.map((x) => h('div', { class: 'card2' }, h('h3', {}, x.title), h('p', {}, x.text)))));
  if (c.images && c.images.length) el.append(h('div', { class: 'gal' }, c.images.map((x) => h('img', { src: x.src, alt: x.alt || '', loading: 'lazy' }))));
  if (c.compare) el.append(...compare(c.compare));
  if (c.prototype) el.append(prototype(c.prototype));
  if (c.metrics) el.append(metrics(c.metrics));
  if (c.learned) el.append(h('ul', { class: 'learned' }, c.learned.map((t) => h('li', {}, t))));
  const links = (c.links || []).filter((l) => l.href);
  if (links.length) el.append(h('div', { class: 'cta' }, links.map((l, n) => h('a', { class: n ? 'btn-ghost' : 'btn-primary', href: l.href, target: '_blank', rel: 'noopener' }, l.label))));
  return el;
}

function render() {
  document.title = `${P.title} | Case study | Tina Asadi`;
  document.querySelector('meta[name="description"]').content = P.summary;
  const idx = slugs.indexOf(key);
  const prev = PROJECTS[slugs[idx - 1]], next = PROJECTS[slugs[idx + 1]];
  const app = document.getElementById('app');
  app.replaceChildren(
    h('div', { class: 'intro' },
      h('span', { class: 'tag' }, 'Case study'),
      h('h1', {}, P.title),
      h('p', { class: 'lead' }, P.summary),
      P.meta ? h('dl', { class: 'meta' }, Object.entries(P.meta).map(([k, v]) => h('div', {}, h('dt', {}, k), h('dd', {}, v)))) : null,
      h('div', { class: 'cover' }, picture(P.hero, P.title, 'hifi'))),
    h('div', { class: 'story' },
      h('nav', { class: 'rail', 'aria-label': 'Chapters' }, P.chapters.map((c) => h('a', { href: '#' + c.id }, c.title))),
      h('div', {}, P.chapters.map(chapter))),
    h('nav', { class: 'pager', 'aria-label': 'More projects' },
      prev ? h('a', { href: `?p=${slugs[idx - 1]}` }, h('small', {}, '← Previous'), prev.title) : h('span'),
      next ? h('a', { class: 'next', href: `?p=${slugs[idx + 1]}` }, h('small', {}, 'Next →'), next.title) : h('span')));

  // Reveal on scroll
  const rv = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); rv.unobserve(e.target); } }), { threshold: 0.12 });
  document.querySelectorAll('.rv').forEach((n) => rv.observe(n));

  // Chapter rail: highlight the chapter being read
  const links = [...document.querySelectorAll('.rail a')];
  const spy = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    links.forEach((a) => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + e.target.id)));
  }), { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('.ch').forEach((n) => spy.observe(n));
}

// Reading progress bar
const bar = document.getElementById('progress');
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${max > 0 ? Math.min(scrollY / max, 1) : 0})`;
    ticking = false;
  });
}, { passive: true });

// Theme toggle (same storage key as the main site)
document.getElementById('themeToggle').addEventListener('click', () => {
  const root = document.documentElement;
  root.classList.toggle('light');
  localStorage.setItem('theme', root.classList.contains('light') ? 'light' : 'dark');
});

render();
</script>
</body>
</html>
